[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "punto-vuela-linux-toolkit"
version = "0.1.0"
description = "Centro de software Linux de Punto Vuela"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PySide6==6.6.3"]

[project.scripts]
punto-vuela-linux-toolkit = "punto_vuela_toolkit.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
punto_vuela_toolkit = ["qml/*.qml", "assets/*"]
