name: Deploy Cloudflare Mail Worker

on:
  workflow_dispatch:
  push:
    branches:
      - rewrite/electron-desktop
    paths:
      - "services/cloudflare-mail/**"
      - ".github/workflows/deploy-cloudflare-mail.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy punto-vuela-mail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/cloudflare-mail
          command: deploy
