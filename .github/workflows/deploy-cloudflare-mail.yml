name: Deploy Cloudflare Mail Worker

on:
  workflow_dispatch:
  push:
    branches:
      - rewrite/electron-desktop
    paths:
      - "services/cloudflare-mail/**"
      - ".github/workflows/deploy-cloudflare-mail.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy punto-vuela-mail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate sender secret
        env:
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
        run: |
          if [ -z "$MAIL_FROM_EMAIL" ]; then
            echo "::error::Missing GitHub Actions secret MAIL_FROM_EMAIL. Add a verified Brevo sender address in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Sync Brevo sender secret to Cloudflare Worker
        working-directory: services/cloudflare-mail
        env:
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$MAIL_FROM_EMAIL" | npx --yes wrangler@4 secret put MAIL_FROM_EMAIL

      - name: Deploy Worker with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/cloudflare-mail
          command: deploy
