name: Electron AppImage · Build and Release

on:
  workflow_dispatch:
  push:
    branches: ["rewrite/electron-desktop"]
    tags: ["v*"]
  pull_request:
    branches: ["rewrite/electron-desktop"]
    paths:
      - "desktop-electron/**"
      - ".github/workflows/electron-prototype.yml"

permissions:
  contents: write

concurrency:
  group: electron-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Electron AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      image: debian:bullseye-slim
    steps:
      - name: Prepare glibc 2.31 environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sed -i -e 's#deb.debian.org/debian#archive.debian.org/debian#g' -e 's#security.debian.org/debian-security#archive.debian.org/debian-security#g' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Retries=1 update
          apt-get install -y ca-certificates curl git xz-utils libfuse2 xvfb libgtk-3-0 libnss3 libasound2 libxss1 libxtst6 libgbm1 libxkbcommon0 libatspi2.0-0 libdrm2 libx11-xcb1 libxcb-dri3-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxrender1 libxshmfence1 dbus librsvg2-bin
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm dependencies
        working-directory: desktop-electron
        run: npm install
      - name: Generate app icon
        run: |
          mkdir -p desktop-electron/build
          rsvg-convert -w 512 -h 512 desktop-electron/public/assets/logo_toolkit.svg -o desktop-electron/public/assets/logo_toolkit.png
          cp desktop-electron/public/assets/logo_toolkit.png desktop-electron/build/icon.png
      - name: Typecheck and test
        working-directory: desktop-electron
        run: npm test
      - name: Configure updater channel
        working-directory: desktop-electron
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            printf '{"channel":"stable"}\n' > updater-channel.json
          else
            TEST_TAG="prueba-84"
            printf '{"channel":"test","testTag":"%s"}\n' "$TEST_TAG" > updater-channel.json
          fi
      - name: Build
        working-directory: desktop-electron
        run: npm run build
      - name: Package AppImage
        working-directory: desktop-electron
        run: npm run dist:appimage
      - name: Smoke test packaged AppImage
        working-directory: desktop-electron
        shell: bash
        run: |
          chmod +x release/*.AppImage
          set +e
          timeout 30s xvfb-run -a dbus-run-session -- ./release/*.AppImage --appimage-extract-and-run --no-sandbox --disable-gpu --disable-dev-shm-usage --smoke-test > /tmp/pv-electron-smoke.log 2>&1
          code=$?
          set -e
          cat /tmp/pv-electron-smoke.log
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          if grep -Eqi "error while loading shared libraries|GLIBC_[0-9.]+ not found" /tmp/pv-electron-smoke.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: puntos-vuela-toolkit-electron-appimage
          path: desktop-electron/release/*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: puntos-vuela-toolkit-electron-appimage
      - name: Generate SHA256SUMS
        run: |
          APPIMAGE="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          sha256sum "$APPIMAGE" > SHA256SUMS
      - name: Publish Electron release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Puntos Vuela Toolkit ${{ github.ref_name }} · Electron
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            *.AppImage
            SHA256SUMS

  test-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/rewrite/electron-desktop'
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: puntos-vuela-toolkit-electron-appimage
      - name: Generate SHA256SUMS
        run: |
          APPIMAGE="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          sha256sum "$APPIMAGE" > SHA256SUMS
      - name: Publish PRUEBA-84 test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba-84
          target_commitish: rewrite/electron-desktop
          name: PRUEBA-84 · Banner de prueba del actualizador
          prerelease: true
          body: |
            - PRUEBA-84: esta release se utiliza exclusivamente para comprobar el actualizador.
            - El instalador incluye el identificador prueba-84 y solo actualizará desde prueba-N a una N superior.
            - El banner/modal debe identificar claramente el canal de pruebas.
            - Build creado desde la rama rewrite/electron-desktop.
          fail_on_unmatched_files: true
          files: |
            *.AppImage
            SHA256SUMS
