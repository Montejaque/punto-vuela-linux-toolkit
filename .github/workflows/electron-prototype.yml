name: Electron prototype

on:
  push:
    branches: [rewrite/electron-desktop]
    paths:
      - "desktop-electron/**"
      - ".github/workflows/electron-prototype.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop-electron/**"
      - ".github/workflows/electron-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-electron/package.json
      - name: Install dependencies
        working-directory: desktop-electron
        run: npm install
      - name: TypeScript checks
        working-directory: desktop-electron
        run: npm run typecheck
      - name: Build renderer and Electron main process
        working-directory: desktop-electron
        run: npm run build
      - name: Package AppImage
        working-directory: desktop-electron
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run dist:appimage
      - name: Upload prototype AppImage
        uses: actions/upload-artifact@v4
        with:
          name: puntos-vuela-toolkit-electron-prototype
          path: desktop-electron/release/*.AppImage
          if-no-files-found: error
          retention-days: 14
