name: Publish interactive user guide
on:
  push:
    branches: ["rewrite/electron-desktop"]
    paths:
      - "desktop-electron/src/**"
      - "desktop-electron/public/**"
      - "desktop-electron/package.json"
      - "docs-site/**"
      - "docs/GUIA-DE-AYUDA.md"
      - "guia.html"
      - "privacy.html"
      - "terms.html"
      - ".github/workflows/publish-guide-pages.yml"
      - ".github/workflows/publish-guide-fallback.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish-guide-pages-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-guide:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
        working-directory: desktop-electron
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
        working-directory: desktop-electron
      - name: Build Electron application
        run: npm run build
        working-directory: desktop-electron
      - name: Start Vite server
        timeout-minutes: 3
        run: |
          node ./node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 > /tmp/toolkit-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/toolkit-vite.log
          exit 1
        working-directory: desktop-electron
      - name: Capture updater in real Electron
        timeout-minutes: 5
        run: xvfb-run -a dbus-run-session -- node ../docs-site/capture-electron-updater.mjs
        working-directory: desktop-electron
      - name: Capture nine app screens
        timeout-minutes: 10
        run: node ../docs-site/capture-screenshots.mjs
        working-directory: desktop-electron
      - name: Validate 11 actual PNG screenshots
        timeout-minutes: 2
        run: |
          set -eu
          for image in 01-inicio 02-catalogo 03-ficha-app 04-mis-aplicaciones 05-herramientas 06-recursos 07-faqs 08-contacto 09-ayuda 10-updater-modal 11-updater-banner; do
            p="docs-site/screenshots/$image.png"
            test -s "$p" || { echo "::error::Missing screenshot $p"; exit 1; }
            file "$p" | grep -q 'PNG image data' || { echo "::error::Invalid image $p"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - name: Assemble and validate deployment
        timeout-minutes: 3
        run: |
          set -eu
          mkdir -p _site/screenshots
          cp docs-site/index.html _site/index.html
          cp -a docs-site/screenshots/. _site/screenshots/
          cp desktop-electron/public/assets/logo_toolkit.svg _site/logo_toolkit.svg
          sed -i 's#../desktop-electron/public/assets/logo_toolkit.svg#logo_toolkit.svg#' _site/index.html
          cp docs/GUIA-DE-AYUDA.md _site/GUIA-DE-AYUDA.md
          cp privacy.html _site/privacy.html
          cp terms.html _site/terms.html
          cp guia.html _site/guia.html
          for image in 01-inicio 02-catalogo 03-ficha-app 04-mis-aplicaciones 05-herramientas 06-recursos 07-faqs 08-contacto 09-ayuda 10-updater-modal 11-updater-banner; do
            test -s "_site/screenshots/$image.png"
            grep -q "screenshots/$image.png" _site/guia.html || { echo "::error::Missing guide image reference $image"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v3
        timeout-minutes: 3
        with:
          path: _site
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build-guide
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
