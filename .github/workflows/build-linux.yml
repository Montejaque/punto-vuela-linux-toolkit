name: Build Linux packages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build ${{ matrix.format }} (x86_64)
    runs-on: ubuntu-22.04
    # Debian 11 uses GLIBC 2.31 (Ubuntu 20.04 baseline) and this image
    # includes a working Python 3.10/OpenSSL, unlike the minimal Ubuntu image.
    container:
      image: python:3.10-bullseye
      options: --dns 1.1.1.1 --dns 8.8.8.8
    strategy:
      fail-fast: false
      matrix:
        format: [appimage]
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          # Debian 11 security repository has moved out of the live mirror.
          # Use Bullseye's stable main repository for reproducible build tooling.
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          find /etc/apt/sources.list.d -type f -name '*.list' -exec sed -i '/bullseye-security/d' {} +
          apt-get update
          apt-get install -y --no-install-recommends curl wget ca-certificates patchelf desktop-file-utils rpm cpio libegl1 libgl1 libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Fetch official Punto Vuela logo
        run: bash packaging/fetch-brand-assets.sh
      - name: Validate Python syntax
        run: python -m compileall -q src tests
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Smoke-test QML application
        env:
          QT_QPA_PLATFORM: offscreen
        run: PYTHONPATH=src python -m punto_vuela_toolkit --smoke-test
      - name: Build application bundle
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name punto-vuela-linux-toolkit \
            --add-data "src/punto_vuela_toolkit/qml:punto_vuela_toolkit/qml" \
            --add-data "src/punto_vuela_toolkit/assets:punto_vuela_toolkit/assets" \
            --collect-all PySide6 \
            --collect-all shiboken6 \
            --paths src src/launcher.py
          test -x dist/punto-vuela-linux-toolkit/punto-vuela-linux-toolkit
      - name: Smoke-test frozen executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/punto-vuela-linux-toolkit/punto-vuela-linux-toolkit --smoke-test
      - name: Build AppImage
        if: matrix.format == 'appimage'
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp -a dist/punto-vuela-linux-toolkit/. AppDir/usr/bin/
          cp packaging/punto-vuela-linux-toolkit.desktop AppDir/usr/share/applications/
          cp src/punto_vuela_toolkit/assets/logotipo-v.svg AppDir/usr/share/icons/hicolor/scalable/apps/punto-vuela-linux-toolkit.svg
          wget --https-only --tries=3 --timeout=30 -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          ./linuxdeploy --appimage-extract-and-run --appdir AppDir --output appimage
          APPIMAGE="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          QT_QPA_PLATFORM=offscreen "$APPIMAGE" --appimage-extract-and-run --smoke-test
      - name: Build DEB and RPM
        if: matrix.format != 'appimage'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then VERSION="0.1.0.${GITHUB_RUN_NUMBER}"; fi
          ARCH=amd64
          if [[ "${{ matrix.format }}" == "rpm" ]]; then ARCH=x86_64; fi
          mkdir -p package-root/opt/punto-vuela-linux-toolkit package-root/usr/bin package-root/usr/share/applications package-root/usr/share/icons/hicolor/scalable/apps
          cp -a dist/punto-vuela-linux-toolkit/. package-root/opt/punto-vuela-linux-toolkit/
          install -m 755 packaging/launcher.sh package-root/usr/bin/punto-vuela-linux-toolkit
          install -m 644 packaging/punto-vuela-linux-toolkit.desktop package-root/usr/share/applications/
          install -m 644 src/punto_vuela_toolkit/assets/logotipovuela.svg package-root/usr/share/icons/hicolor/scalable/apps/punto-vuela-linux-toolkit.svg
          mkdir -p package-root/DEBIAN
          cat > package-root/DEBIAN/control <<EOF
          Package: punto-vuela-linux-toolkit
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Punto Vuela Montejaque
          Description: Centro de software Linux de Punto Vuela
          EOF
          if [[ "${{ matrix.format }}" == "deb" ]]; then
            dpkg-deb --root-owner-group --build package-root "punto-vuela-linux-toolkit_${VERSION}_amd64.deb"
          else
            mkdir -p package-root/rpm
            cat > package-root/rpm/punto-vuela-linux-toolkit.spec <<EOF
          Name: punto-vuela-linux-toolkit
          Version: $VERSION
          Release: 1
          Summary: Centro de software Linux de Punto Vuela
          License: MIT
          BuildArch: x86_64
          %description
          Centro de software Linux de Punto Vuela
          %install
          mkdir -p %{buildroot}
          cp -a $PWD/package-root/opt $PWD/package-root/usr %{buildroot}/
          %files
          /opt/punto-vuela-linux-toolkit
          /usr/bin/punto-vuela-linux-toolkit
          /usr/share/applications/punto-vuela-linux-toolkit.desktop
          /usr/share/icons/hicolor/scalable/apps/punto-vuela-linux-toolkit.svg
          EOF
            rpmbuild --define "_topdir $PWD/rpmbuild" --define "_buildrootdir $PWD/rpmbuild/BUILDROOT" -bb package-root/rpm/punto-vuela-linux-toolkit.spec
            cp rpmbuild/RPMS/x86_64/*.rpm .
          fi
          PACKAGE="$(find . -maxdepth 1 -type f -name "*.${{ matrix.format }}" -print -quit)"
          test -n "$PACKAGE"
          mkdir -p package-check
          if [[ "${{ matrix.format }}" == "deb" ]]; then
            dpkg-deb -x "$PACKAGE" package-check
          else
            rpm2cpio "$PACKAGE" | (cd package-check && cpio -idm --quiet)
          fi
          QT_QPA_PLATFORM=offscreen package-check/opt/punto-vuela-linux-toolkit/punto-vuela-linux-toolkit --smoke-test
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.format }}-x86_64
          path: |
            *.AppImage
            *.deb
            *.rpm
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-appimage-x86_64
          merge-multiple: true
      - name: Verify all release packages exist
        run: |
          test -n "$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          sha256sum *.AppImage > SHA256SUMS
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Punto Vuela Linux Toolkit ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            *.AppImage
            SHA256SUMS
