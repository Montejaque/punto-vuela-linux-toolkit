name: Build Linux packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        format: [appimage, deb, rpm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf desktop-file-utils imagemagick rpm ruby ruby-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Fetch official Punto Vuela logo
        run: bash packaging/fetch-brand-assets.sh
      - name: Build application bundle
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name punto-vuela-linux-toolkit \
            --add-data "src/punto_vuela_toolkit/qml:punto_vuela_toolkit/qml" \
            --add-data "src/punto_vuela_toolkit/assets:punto_vuela_toolkit/assets" \
            --collect-all PySide6 \
            --paths src src/punto_vuela_toolkit/__main__.py
      - name: Build AppImage
        if: matrix.format == 'appimage'
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp -a dist/punto-vuela-linux-toolkit/. AppDir/usr/bin/
          cp packaging/punto-vuela-linux-toolkit.desktop AppDir/usr/share/applications/
          cp src/punto_vuela_toolkit/assets/logotipovuela.svg AppDir/usr/share/icons/hicolor/scalable/apps/punto-vuela-linux-toolkit.svg
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          ./linuxdeploy --appimage-extract-and-run --appdir AppDir --output appimage
      - name: Build DEB and RPM
        if: matrix.format != 'appimage'
        run: |
          sudo gem install --no-document fpm
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then VERSION="0.1.0.${GITHUB_RUN_NUMBER}"; fi
          ARCH=amd64
          if [[ "${{ matrix.format }}" == "rpm" ]]; then ARCH=x86_64; fi
          fpm -s dir -t "${{ matrix.format }}" -n punto-vuela-linux-toolkit -v "$VERSION" \
            --description "Centro de software Linux de Punto Vuela" \
            --license MIT --architecture "$ARCH" \
            --after-install packaging/post-install.sh \
            dist/punto-vuela-linux-toolkit/=/opt/punto-vuela-linux-toolkit/ \
            src/punto_vuela_toolkit/assets/logotipovuela.svg=/usr/share/icons/hicolor/scalable/apps/punto-vuela-linux-toolkit.svg \
            packaging/launcher.sh=/usr/bin/punto-vuela-linux-toolkit \
            packaging/punto-vuela-linux-toolkit.desktop=/usr/share/applications/punto-vuela-linux-toolkit.desktop
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.format }}-x86_64
          path: |
            *.AppImage
            *.deb
            *.rpm
          if-no-files-found: error
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.deb
            *.rpm
