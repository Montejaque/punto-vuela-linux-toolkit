name: Build Linux packages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build ${{ matrix.format }} (x86_64)
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        format: [appimage, deb, rpm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y curl wget ca-certificates patchelf desktop-file-utils imagemagick rpm ruby ruby-dev libegl1 libgl1 libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Fetch official Punto Vuela logo
        run: bash packaging/fetch-brand-assets.sh
      - name: Validate Python syntax
        run: python -m compileall -q src tests
      - name: Run AppImage manager unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Smoke-test QML application
        env:
          QT_QPA_PLATFORM: offscreen
        run: PYTHONPATH=src python -m punto_vuela_toolkit --smoke-test
      - name: Build application bundle
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name punto-vuela-linux-toolkit \
            --add-data "src/punto_vuela_toolkit/qml:punto_vuela_toolkit/qml" \
            --add-data "src/punto_vuela_toolkit/assets:punto_vuela_toolkit/assets" \
            --collect-all PySide6 \
            --collect-all shiboken6 \
            --paths src src/launcher.py
          test -x dist/punto-vuela-linux-toolkit/punto-vuela-linux-toolkit
      - name: Smoke-test frozen executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/punto-vuela-linux-toolkit/punto-vuela-linux-toolkit --smoke-test
      - name: Build AppImage
        if: matrix.format == 'appimage'
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp -a dist/punto-vuela-linux-toolkit/. AppDir/usr/bin/
          cp packaging/punto-vuela-linux-toolkit.desktop AppDir/usr/share/applications/
          cp src/punto_vuela_toolkit/assets/logotipovuela.svg AppDir/usr/share/icons/hicolor/scalable/apps/punto-vuela-linux-toolkit.svg
          wget --https-only --tries=3 --timeout=30 -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          ./linuxdeploy --appimage-extract-and-run --appdir AppDir --output appimage
          APPIMAGE="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          QT_QPA_PLATFORM=offscreen "$APPIMAGE" --appimage-extract-and-run --smoke-test
      - name: Build DEB and RPM
        if: matrix.format != 'appimage'
        run: |
          gem install --no-document fpm
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then VERSION="0.1.0.${GITHUB_RUN_NUMBER}"; fi
          ARCH=amd64
          if [[ "${{ matrix.format }}" == "rpm" ]]; then ARCH=x86_64; fi
          fpm -s dir -t "${{ matrix.format }}" -n punto-vuela-linux-toolkit -v "$VERSION" \
            --description "Centro de software Linux de Punto Vuela" \
            --license MIT --architecture "$ARCH" \
            --after-install packaging/post-install.sh \
            dist/punto-vuela-linux-toolkit/=/opt/punto-vuela-linux-toolkit/ \
            src/punto_vuela_toolkit/assets/logotipovuela.svg=/usr/share/icons/hicolor/scalable/apps/punto-vuela-linux-toolkit.svg \
            packaging/launcher.sh=/usr/bin/punto-vuela-linux-toolkit \
            packaging/punto-vuela-linux-toolkit.desktop=/usr/share/applications/punto-vuela-linux-toolkit.desktop
          PACKAGE="$(find . -maxdepth 1 -type f -name "*.${{ matrix.format }}" -print -quit)"
          test -n "$PACKAGE"
          mkdir -p package-check
          if [[ "${{ matrix.format }}" == "deb" ]]; then
            dpkg-deb -x "$PACKAGE" package-check
          else
            apt-get install -y cpio
            (cd package-check && rpm2cpio "../$PACKAGE" | cpio -idm --quiet)
          fi
          QT_QPA_PLATFORM=offscreen package-check/opt/punto-vuela-linux-toolkit/punto-vuela-linux-toolkit --smoke-test
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.format }}-x86_64
          path: |
            *.AppImage
            *.deb
            *.rpm
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*-x86_64
          merge-multiple: true
      - name: Verify all release packages exist
        run: |
          test -n "$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find . -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find . -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          sha256sum *.AppImage *.deb *.rpm > SHA256SUMS
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            *.AppImage
            *.deb
            *.rpm
            SHA256SUMS
